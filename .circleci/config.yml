version: 2.1

workflows:
    version: 2
    test:
        jobs:
            - test84
            - test85

jobs:
    test84:
        docker:
            - image: composer:2.8.11 # PHP 8.4
        steps:
            - checkout
            - run:
                  name: composer-install
                  command: composer install --no-progress
            - run:
                  name: test
                  command: ./vendor/bin/phpunit
    test85:
        docker:
            - image: composer:2.11.2 # PHP 8.5
        steps:
            - checkout
            - run:
                  name: composer-install
                  command: composer install --no-progress
            - run:
                  name: test
                  command: ./vendor/bin/phpunit
